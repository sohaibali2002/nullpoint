  </text>
  <line x1="88" y1="566" x2="1112" y2="566" stroke="#252A36" stroke-width="1"/>
  <text x="88" y="598" font-family="JetBrains Mono, monospace" font-size="16" fill="#6B7284">
    Backtests are hypotheses. Not financial advice.
