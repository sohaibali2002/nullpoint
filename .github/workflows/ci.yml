name: CI

on:
  push:
    branches: [main, master, "freebuff/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy engine data agents sandbox apps/api/api
      - name: Tests + coverage gate (engine & validation)
        env:
          LLM_PROVIDER: mock
          APP_ENV: test
        run: |
          uv run pytest --cov --cov-report=term-missing --cov-report=xml
          uv run pytest --cov=engine --cov-report=term-missing --cov-fail-under=80
      - name: Noise gate — random strategies must not be promoted
        env:
          LLM_PROVIDER: mock
        run: uv run pytest tests/test_noise_gate.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
