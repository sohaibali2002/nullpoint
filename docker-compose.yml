name: nullpoint

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nullpoint
      POSTGRES_PASSWORD: nullpoint
      POSTGRES_DB: nullpoint
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullpoint"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://nullpoint:nullpoint@postgres:5432/nullpoint
      REDIS_URL: redis://redis:6379/0
      LAKE_ROOT: /lake
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["lake:/lake"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://nullpoint:nullpoint@postgres:5432/nullpoint
      REDIS_URL: redis://redis:6379/0
      LAKE_ROOT: /lake
    command: ["arq", "api.jobs.WorkerSettings"]
    volumes: ["lake:/lake"]
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  lake:
