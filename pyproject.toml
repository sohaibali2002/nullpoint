[project]
name = "nullpoint"
version = "0.1.0"
description = "Nullpoint — multi-agent autonomous quant research that has to beat the null hypothesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Nullpoint" }]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "arq>=0.26.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
  "scipy>=1.13.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "structlog>=24.1.0",
  "PyJWT>=2.9.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.11.0",
  "pandas-stubs>=2.2.0",
  "types-requests>=2.32.0",
]
vbt = ["vectorbt>=0.26.0"]
bta = ["backtesting>=0.3.3"]
llm = ["anthropic>=0.34.0"]
pdf = ["reportlab>=4.2.0"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "engine",
  "data",
  "agents",
  "sandbox",
  "api",
  "api.routers",
  "api.services",
]
py-modules = []

[tool.setuptools.package-dir]
api = "apps/api/api"

[tool.setuptools.package-data]
brand = ["*.svg", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PT011"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["apps/web", "scripts/demo_sprint.py"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running checks (Monte Carlo, PBO grids)",
  "network: requires outbound network; skipped by default",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["engine", "data", "agents", "sandbox", "api"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
