# Staging configuration. Same image as production, separate app, database, Redis and lake volume.
# Deploy from the repository root: fly deploy --config infra/fly.staging.toml
app = "nullpoint-staging"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  APP_ENV = "staging"
  LAKE_ROOT = "/lake"
  SANDBOX_BACKEND = "docker"
  JOB_RUNNER = "arq"
  ALLOW_NETWORK = "true"
  AUTO_CREATE_SCHEMA = "false"
  ENGINE_SANDBOX = "true"

[deploy]
  release_command = "alembic upgrade head"

[processes]
  api = "uvicorn api.main:app --host 0.0.0.0 --port 8000"
  worker = "arq api.jobs.WorkerSettings"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[mounts]
  source = "lake"
  destination = "/lake"
